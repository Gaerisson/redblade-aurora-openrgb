name: Firmware checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows configuration rollback and RGB restart order
        shell: pwsh
        run: ./tests/windows_tools_test.ps1
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test firmware and controls with sanitizers
        run: |
          set -e
          for suite in protocol controls rendering recorder speed_typing turbo_helpers keymap_hooks usb_lighting configuration custom_colors options reactive_extended modifier_dimming; do
            cc -std=c11 -Wall -Wextra -Werror -O1 -g -DUSE_CIE1931_CURVE -fsanitize=address,undefined \
              -I tests/stubs -I tests -I tests/upstream -I firmware/common -I firmware/aurora_via \
              tests/${suite}_test.c tests/qmk_fixture.c tests/store_flash_fixture.c tests/upstream/color.c tests/upstream/led_tables.c \
              firmware/aurora_via/redblade_rgb.c firmware/aurora_via/redblade_controls.c firmware/aurora_via/redblade_recorder.c firmware/aurora_via/redblade_config.c firmware/aurora_via/redblade_store.c -o /tmp/${suite}-test
            /tmp/${suite}-test
          done
      - name: Test flash journal with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined \
            -I tests/stubs -I tests -I firmware/aurora_via tests/store_test.c tests/store_flash_fixture.c \
            tests/store_callbacks_stub.c firmware/aurora_via/redblade_store.c -o /tmp/store-test
          /tmp/store-test
      - name: Check Python utilities
        run: python3 -m py_compile tools/*.py
      - name: Test standalone OpenRGB Core with sanitizers
        run: |
          set -e
          for suite in core core_keymap_hooks core_usb_lighting; do
            cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined \
              -include firmware/openrgb_core/config.h -I tests/stubs -I tests -I firmware/common -I firmware/openrgb_core \
              tests/${suite}_test.c tests/qmk_fixture.c firmware/openrgb_core/redblade_core.c -o /tmp/${suite}-test
            /tmp/${suite}-test
          done
          python3 tools/check_core_release.py
      - name: Check shortcut mapping and tooling recovery
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test Studio web interface logic
        run: node --test app/Web/tests/*.cjs
      - name: Verify committed firmware artifact
        run: python3 tools/check_release.py
      - name: Build and run native regression benchmark
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -DUSE_CIE1931_CURVE \
            -I tests/stubs -I tests -I firmware/aurora_via \
            tests/benchmark.c tests/qmk_fixture.c tests/store_flash_fixture.c tests/upstream/color.c tests/upstream/led_tables.c \
            firmware/aurora_via/redblade_rgb.c firmware/aurora_via/redblade_controls.c firmware/aurora_via/redblade_recorder.c firmware/aurora_via/redblade_config.c firmware/aurora_via/redblade_store.c -o /tmp/native-benchmark
          /tmp/native-benchmark

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM and QMK build tools
        run: |
          # Use QMK's complete GCC/binutils/newlib distribution, matching the
          # local compiler generation without depending on Ubuntu mirrors.
          toolchain_archive="$RUNNER_TEMP/qmk-toolchains.tar.zst"
          toolchain_directory="$RUNNER_TEMP/qmk-toolchains"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
            https://github.com/qmk/qmk_toolchains/releases/download/v15.2.0-1/qmk_toolchains-gcc15.2.0-host_linuxX64.tar.zst \
            --output "$toolchain_archive"
          echo "6b136919e3526f3f373e91f7d011a006e968a3169262d33cf6efa3e6c605c3ca  $toolchain_archive" | sha256sum --check
          mkdir -p "$toolchain_directory"
          tar --zstd -xf "$toolchain_archive" -C "$toolchain_directory"
          arm_gcc="$(find "$toolchain_directory" -name arm-none-eabi-gcc -print -quit)"
          test -x "$arm_gcc"
          "$arm_gcc" --version
          dirname "$arm_gcc" >> "$GITHUB_PATH"
          python3 -m pip install --user --break-system-packages --timeout 30 --retries 2 qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned SonixQMK
        run: |
          git clone --no-checkout https://github.com/SonixQMK/qmk_firmware.git "$RUNNER_TEMP/qmk_firmware"
          git -C "$RUNNER_TEMP/qmk_firmware" checkout 62973ee48a976c6f7cc6d4f7b198bd48a2fdfe60
          git -C "$RUNNER_TEMP/qmk_firmware" submodule update --init --recursive
      - name: Build both editions and refresh manifests
        run: |
          set -eu
          qmk_tree="$RUNNER_TEMP/qmk_firmware"
          python3 tools/prepare_firmware.py "$qmk_tree"
          python3 tools/prepare_firmware.py "$qmk_tree" --edition core
          (cd "$qmk_tree" && qmk compile -kb designedbygg/redblade/rbfs -km aurora_via -e SKIP_GIT=yes)
          (cd "$qmk_tree" && qmk compile -kb designedbygg/redblade/rbfs -km openrgb_core -e SKIP_GIT=yes)
          cp "$qmk_tree/designedbygg_redblade_rbfs_aurora_via.bin" dist/redblade-fs-aurora-via.bin
          cp "$qmk_tree/designedbygg_redblade_rbfs_openrgb_core.bin" dist/redblade-fs-openrgb-core.bin
          python3 tools/check_release.py --update --elf "$qmk_tree/.build/designedbygg_redblade_rbfs_aurora_via.elf"
          python3 tools/check_core_release.py --update --elf "$qmk_tree/.build/designedbygg_redblade_rbfs_openrgb_core.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-firmware
          path: dist/
  studio-build:
    needs: firmware-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rebuilt-firmware
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify rebuilt firmware and fetch pinned helper
        shell: pwsh
        run: |
          python tools/check_release.py
          if ($LASTEXITCODE) { throw 'Full manifest invalid' }
          python tools/check_core_release.py
          if ($LASTEXITCODE) { throw 'Core manifest invalid' }
          $archive = Join-Path $env:RUNNER_TEMP 'sonixflasher.zip'
          Invoke-WebRequest https://github.com/SonixQMK/SonixFlasherC/releases/download/3.1.0/sonixflasher-windows-x86_64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '2958CA8DE3021BF96D5C900B6BB5021A2D4C1A528D8DA2516598FD067BBF0619') { throw 'Unexpected helper archive' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'sonixflasher')
      - name: Fetch and verify pinned Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/068be74d-a831-494f-8f57-c173756d5a33/MicrosoftEdgeWebview2Setup.exe' -OutFile $bootstrapper
          if ((Get-Item $bootstrapper).Length -ne 1897688 -or (Get-FileHash $bootstrapper -Algorithm SHA256).Hash -ne 'CF2F2445FEF0C5C14E372045F84998771EEB8BB01D59BE4AFD00692FA160082E') { throw 'Unexpected WebView2 bootstrapper' }
          $signature = Get-AuthenticodeSignature -FilePath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') { throw 'WebView2 bootstrapper signature is not valid Microsoft Authenticode' }
      - name: Publish and run hardware-free Studio self-test
        shell: pwsh
        run: |
          ./app/build.ps1 -HelperDirectory (Join-Path $env:RUNNER_TEMP 'sonixflasher') -WebView2Bootstrapper (Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe')
          if ($LASTEXITCODE) { throw 'Studio build or self-test failed' }

      - name: Require Microsoft Edge WebView2 Runtime
        shell: pwsh
        run: |
          $paths = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $runtimes = @($paths | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' })
          if ($runtimes.Count -eq 0) { throw 'WebView2 Runtime is required for the UI self-test' }
      - name: Exercise Studio interface interactions
        shell: pwsh
        run: |
          $test = Start-Process -FilePath (Join-Path $PWD 'app/publish/RedBladePlus-Studio.exe') -ArgumentList '--ui-self-test' -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw "Studio UI self-test failed: $($test.ExitCode)" }
      - name: Collect Studio interface diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-diagnostics
          path: app/publish/ui-test-*
          if-no-files-found: ignore
